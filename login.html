<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Shopping Cart</title>
    <link href="style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="background">

        <div class="right">
            <header>
                <h1>Login</h1>
            </header>


            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                </div>
                <div>
                    <button type="submit" id="login">Login</button>
                </div>
                <div class="mt-3 text-center">
                    <small>Don't have an account? <a href="#">Sign up</a></small>
                </div>
            </form>


            <footer>
                <p>&copy; 2025 My Website</p>
            </footer>
        </div>

    </div>

    
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault(); // prevent default form submission

            const emailInput = document.getElementById("email");
            const email = emailInput.value;

            if (emailInput.checkValidity()) {
                // ✅ Email is valid – proceed with click function
                handleValidEmail();
            } else {
                // ❌ Email is invalid – show built-in validation message
                emailInput.reportValidity(); // shows the native browser error
            }
        });

        function handleValidEmail() {
            window.location.href = "index.html"; // Replace with your file
        }
    </script>

</body>

</html>
